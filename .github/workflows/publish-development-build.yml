name: Publish development build to Docker Hub

on:
  push:
    branches: [ "development" ]

jobs:
  build-and-publish:
    name: Build and publish development docker images
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build the server image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: robinmayer/volabyte-server:development
      - name: Build the web app image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: web-app
          push: true
          tags: robinmayer/volabyte-web:development
